name: Promote SharedDev to Test

# Manually triggered pipeline that re-validates SharedDev (security scan, unit
# tests, end-to-end regression) and only then deploys the same infrastructure
# definitions to the Test environment, followed by a post-deploy regression
# pass against Test.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm you want to promote SharedDev to Test'
        required: true
        type: string

permissions:
  contents: read

env:
  SHAREDDEV_RESOURCE_GROUP: itp
  SHAREDDEV_PARAMETER_FILE: infra/parameters/shareddev.bicepparam
  TEST_RESOURCE_GROUP: itp-test
  TEST_PARAMETER_FILE: infra/parameters/test.bicepparam
  AZURE_SUBSCRIPTION_ID: a2a8d07d-bc4a-4483-ad5a-21de20170904

jobs:
  validate-confirmation:
    name: Validate confirmation input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation text
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "promote" ]; then
            echo "::error::You must type 'promote' to run this pipeline. Aborting."
            exit 1
          fi

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: validate-confirmation
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Microsoft Security DevOps scan
        uses: microsoft/security-devops-action@v1
        id: msdo
        with:
          # This repo is Bicep/IaC + GitHub Actions only (no JS/TS source), so
          # restrict to the categories that apply; the default "code"
          # category pulls in eslint, which fatals with a parsing error on a
          # repo with no eslint config/JS files instead of just skipping.
          categories: 'IaC,secrets'

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: validate-confirmation
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser

      - name: Run unit tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/unit/Infra.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  verify-shareddev:
    name: Verify SharedDev is healthy
    runs-on: self-hosted
    needs: [security-scan, unit-tests]
    environment: shareddev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure CLI session and select subscription
        shell: powershell
        run: |
          az account show | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No active 'az login' session found on this runner. Run 'az login' on this workstation once and keep the session active."
          }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser

      - name: Run end-to-end regression tests against SharedDev
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Container = New-PesterContainer -Path 'tests/e2e/Regression.Tests.ps1' -Data @{
            ResourceGroup  = '${{ env.SHAREDDEV_RESOURCE_GROUP }}'
            ParameterFile  = '${{ env.SHAREDDEV_PARAMETER_FILE }}'
          }
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  deploy-test:
    name: Deploy to Test
    runs-on: self-hosted
    needs: verify-shareddev
    # The "test" GitHub Environment should be configured with required
    # reviewers so this step pauses for manual approval even though the
    # pipeline itself was triggered automatically-in-sequence above.
    environment: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure CLI session and select subscription
        shell: powershell
        run: |
          az account show | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No active 'az login' session found on this runner. Run 'az login' on this workstation once and keep the session active."
          }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Ensure Test resource group exists
        shell: powershell
        run: |
          # Use "az group exists" (returns 'true'/'false' with exit code 0
          # either way), not "az group show" (exits non-zero and writes to
          # stderr when the group is missing - which is the expected,
          # common case on a first run). GitHub Actions sets
          # $ErrorActionPreference = 'Stop' for this shell, which turns that
          # expected stderr/non-zero exit into a terminating error even
          # though "2>$null" redirects it, so the fallback az group create
          # below was never reached.
          $exists = az group exists --name $env:TEST_RESOURCE_GROUP
          if ($exists -eq 'false') {
            az group create --name $env:TEST_RESOURCE_GROUP --location eastus
          }

      - name: Resolve role definition and role assignment GUIDs dynamically
        # See the equivalent step in ci-pr-and-shareddev.yml for rationale.
        # For a brand-new Test resource group the managed identities won't
        # exist yet on the first run, so the role assignment lookup resolves
        # to empty values and main.bicep computes fresh GUIDs instead. The
        # role DEFINITION IDs (global constants) are still resolved by name
        # even here, so this workflow never needs to be hand-edited if
        # Microsoft changes one.
        shell: powershell
        run: |
          # GitHub Actions sets $ErrorActionPreference = 'Stop' for this
          # shell. Several az CLI calls below are EXPECTED to fail (e.g.
          # "az identity show" for a managed identity that doesn't exist yet
          # on a first-ever deploy) as part of normal control flow, and each
          # already checks $LASTEXITCODE itself - but under 'Stop', that
          # expected failure is converted into a terminating PowerShell
          # error before the $LASTEXITCODE check is ever reached, even
          # though stderr is redirected. Reset to 'Continue' to restore
          # normal native-command exit-code semantics for this script.
          $ErrorActionPreference = 'Continue'

          $paramContent = Get-Content $env:TEST_PARAMETER_FILE -Raw
          function Get-BicepParamValue($Content, $Name) {
            if ($Content -match "param $Name\s*=\s*'([^']+)'") { return $Matches[1] }
            throw "Could not find parameter '$Name' in the parameter file"
          }
          $storageAccountName = Get-BicepParamValue $paramContent 'storageAccountName'
          $eventHubNamespaceName = Get-BicepParamValue $paramContent 'eventHubNamespaceName'
          $adxManagedIdentityName = Get-BicepParamValue $paramContent 'adxManagedIdentityName'
          $eventGridManagedIdentityName = Get-BicepParamValue $paramContent 'eventGridManagedIdentityName'

          function Get-RoleDefinitionId($roleName) {
            $id = az role definition list --name $roleName --query "[0].name" -o tsv --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $id) {
              throw "Could not resolve built-in role definition ID for role '$roleName'. Verify the role name is correct and this account can read role definitions."
            }
            return $id.Trim()
          }

          function Get-PrincipalId($name) {
            $json = az identity show -g $env:TEST_RESOURCE_GROUP -n $name -o json --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $json) { return $null }
            return ($json | ConvertFrom-Json).principalId
          }

          function Get-ExistingAssignmentName($principalId, $roleDefinitionId, $scope) {
            if (-not $principalId) { return '' }
            $json = az role assignment list --assignee $principalId --role $roleDefinitionId --scope $scope -o json --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $json) { return '' }
            $assignments = $json | ConvertFrom-Json
            if ($assignments -and $assignments.Count -gt 0) { return $assignments[0].name }
            return ''
          }

          $storageBlobDataReaderRoleId = Get-RoleDefinitionId 'Storage Blob Data Reader'
          $eventHubsDataReceiverRoleId = Get-RoleDefinitionId 'Azure Event Hubs Data Receiver'
          $eventHubsDataSenderRoleId   = Get-RoleDefinitionId 'Azure Event Hubs Data Sender'
          Write-Host "Resolved role definition IDs: StorageBlobDataReader=$storageBlobDataReaderRoleId EventHubsDataReceiver=$eventHubsDataReceiverRoleId EventHubsDataSender=$eventHubsDataSenderRoleId"
          "STORAGE_BLOB_DATA_READER_ROLE_ID=$storageBlobDataReaderRoleId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVENTHUBS_DATA_RECEIVER_ROLE_ID=$eventHubsDataReceiverRoleId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVENTHUBS_DATA_SENDER_ROLE_ID=$eventHubsDataSenderRoleId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $storageScope  = "/subscriptions/$($env:AZURE_SUBSCRIPTION_ID)/resourceGroups/$($env:TEST_RESOURCE_GROUP)/providers/Microsoft.Storage/storageAccounts/$storageAccountName"
          $eventHubScope = "/subscriptions/$($env:AZURE_SUBSCRIPTION_ID)/resourceGroups/$($env:TEST_RESOURCE_GROUP)/providers/Microsoft.EventHub/namespaces/$eventHubNamespaceName"

          $adxPrincipalId = Get-PrincipalId $adxManagedIdentityName
          $egPrincipalId  = Get-PrincipalId $eventGridManagedIdentityName

          $ids = [ordered]@{
            adxStorageBlobDataReader    = Get-ExistingAssignmentName $adxPrincipalId $storageBlobDataReaderRoleId $storageScope
            adxEventHubDataReceiver     = Get-ExistingAssignmentName $adxPrincipalId $eventHubsDataReceiverRoleId $eventHubScope
            eventGridEventHubDataSender = Get-ExistingAssignmentName $egPrincipalId  $eventHubsDataSenderRoleId   $eventHubScope
          }

          $json = $ids | ConvertTo-Json -Compress
          Write-Host "Resolved existingRoleAssignmentIds: $json"
          # Escape embedded double quotes: PowerShell doesn't auto-escape
          # quotes embedded in a string when the argument crosses into a
          # native/cmd-shim executable like az.cmd, so passing $json as-is
          # to later "az ... --parameters existingRoleAssignmentIds=..."
          # calls would otherwise arrive corrupted (stripped quotes).
          $escapedJson = $json.Replace('"', '\"')
          "EXISTING_ROLE_ASSIGNMENT_IDS=$escapedJson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: What-if preview
        shell: powershell
        run: |
          az deployment group what-if `
            --resource-group $env:TEST_RESOURCE_GROUP `
            --template-file infra/main.bicep `
            --parameters $env:TEST_PARAMETER_FILE `
            --parameters existingRoleAssignmentIds="$env:EXISTING_ROLE_ASSIGNMENT_IDS" `
            --parameters storageBlobDataReaderRoleId=$env:STORAGE_BLOB_DATA_READER_ROLE_ID `
            --parameters eventHubsDataReceiverRoleId=$env:EVENTHUBS_DATA_RECEIVER_ROLE_ID `
            --parameters eventHubsDataSenderRoleId=$env:EVENTHUBS_DATA_SENDER_ROLE_ID

      - name: Deploy to Test
        shell: powershell
        run: |
          $stamp = Get-Date -Format 'yyyyMMddHHmmss'
          az deployment group create `
            --resource-group $env:TEST_RESOURCE_GROUP `
            --template-file infra/main.bicep `
            --parameters $env:TEST_PARAMETER_FILE `
            --parameters existingRoleAssignmentIds="$env:EXISTING_ROLE_ASSIGNMENT_IDS" `
            --parameters storageBlobDataReaderRoleId=$env:STORAGE_BLOB_DATA_READER_ROLE_ID `
            --parameters eventHubsDataReceiverRoleId=$env:EVENTHUBS_DATA_RECEIVER_ROLE_ID `
            --parameters eventHubsDataSenderRoleId=$env:EVENTHUBS_DATA_SENDER_ROLE_ID `
            --name "promote-$stamp"

  post-deploy-regression:
    name: Post-deploy regression (Test)
    runs-on: self-hosted
    needs: deploy-test
    environment: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure CLI session and select subscription
        shell: powershell
        run: |
          az account show | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No active 'az login' session found on this runner. Run 'az login' on this workstation once and keep the session active."
          }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser

      - name: Run end-to-end regression tests against Test
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Container = New-PesterContainer -Path 'tests/e2e/Regression.Tests.ps1' -Data @{
            ResourceGroup  = '${{ env.TEST_RESOURCE_GROUP }}'
            ParameterFile  = '${{ env.TEST_PARAMETER_FILE }}'
          }
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
