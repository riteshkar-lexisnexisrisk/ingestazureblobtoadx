name: CI - Validate PR and promote to SharedDev

# Runs security scans, unit tests, and end-to-end regression tests on every
# Pull Request targeting main. When a PR is merged (push to main), the same
# checks run again as a safety net, and on success the infrastructure is
# automatically deployed ("promoted") to the SharedDev environment, followed
# by a post-deploy regression pass.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: itp
  BICEP_PARAMETER_FILE: infra/parameters/shareddev.bicepparam
  AZURE_SUBSCRIPTION_ID: a2a8d07d-bc4a-4483-ad5a-21de20170904

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Microsoft Security DevOps scan
        uses: microsoft/security-devops-action@v1
        id: msdo
        with:
          # This repo is Bicep/IaC + GitHub Actions only (no JS/TS source), so
          # restrict to the categories that apply; the default "code"
          # category pulls in eslint, which fatals with a parsing error on a
          # repo with no eslint config/JS files instead of just skipping.
          categories: 'IaC,secrets'

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}

  lint-and-build:
    name: Lint and build Bicep templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Build every module
        run: |
          set -e
          for f in infra/modules/*.bicep; do
            echo "Building $f"
            az bicep build --file "$f" --stdout > /dev/null
          done

      - name: Build every environment parameter file
        run: |
          set -e
          for f in infra/parameters/*.bicepparam; do
            echo "Building $f"
            az bicep build-params --file "$f" --stdout > /dev/null
          done

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser

      - name: Run unit tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/unit/Infra.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'unit-test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Publish unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: unit-test-results.xml

  e2e-regression:
    name: End-to-end regression tests (SharedDev)
    # Runs on the self-hosted runner installed on the workstation, reusing the
    # Azure CLI session that is already logged in there (see README for
    # one-time "az login" setup). No service principal/secrets required.
    runs-on: self-hosted
    needs: unit-tests
    environment: shareddev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure CLI session and select subscription
        shell: powershell
        run: |
          az account show | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No active 'az login' session found on this runner. Run 'az login' on this workstation once and keep the session active."
          }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser

      - name: Run end-to-end regression tests against SharedDev
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Container = New-PesterContainer -Path 'tests/e2e/Regression.Tests.ps1' -Data @{
            ResourceGroup  = '${{ env.AZURE_RESOURCE_GROUP }}'
            ParameterFile  = '${{ env.BICEP_PARAMETER_FILE }}'
          }
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'e2e-test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Publish e2e test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-pre-deploy
          path: e2e-test-results.xml

  deploy-shareddev:
    name: Deploy to SharedDev
    runs-on: self-hosted
    needs: [security-scan, e2e-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: shareddev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure CLI session and select subscription
        shell: powershell
        run: |
          az account show | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No active 'az login' session found on this runner. Run 'az login' on this workstation once and keep the session active."
          }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Resolve role definition and role assignment GUIDs dynamically
        # Two kinds of GUID are resolved here, live against this subscription,
        # so neither one is ever hardcoded in Bicep:
        #  1. Built-in role DEFINITION IDs (e.g. "Storage Blob Data Reader")
        #     are global constants published by Microsoft - identical in
        #     every tenant - but still resolved by name via
        #     "az role definition list" rather than pinned as a literal GUID,
        #     so this workflow keeps working unmodified if Microsoft ever
        #     changes one.
        #  2. Role ASSIGNMENT names are looked up per (principal, role,
        #     scope) to detect whether the ADX/Event Grid managed identities
        #     already have the role assignments this template grants (e.g.
        #     because the resource group was originally created manually,
        #     outside Bicep). If found, the exact existing GUID is reused so
        #     the deployment updates it in place; if not found (a brand-new
        #     environment/subscription), the value stays empty and
        #     main.bicep falls back to computing a fresh, conflict-free GUID.
        # Together, this makes the template portable across
        # environments/subscriptions with no hand-maintained GUIDs anywhere.
        shell: powershell
        run: |
          $paramContent = Get-Content $env:BICEP_PARAMETER_FILE -Raw
          function Get-BicepParamValue($Content, $Name) {
            if ($Content -match "param $Name\s*=\s*'([^']+)'") { return $Matches[1] }
            throw "Could not find parameter '$Name' in the parameter file"
          }
          $storageAccountName = Get-BicepParamValue $paramContent 'storageAccountName'
          $eventHubNamespaceName = Get-BicepParamValue $paramContent 'eventHubNamespaceName'
          $adxManagedIdentityName = Get-BicepParamValue $paramContent 'adxManagedIdentityName'
          $eventGridManagedIdentityName = Get-BicepParamValue $paramContent 'eventGridManagedIdentityName'

          function Get-RoleDefinitionId($roleName) {
            $id = az role definition list --name $roleName --query "[0].name" -o tsv --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $id) {
              throw "Could not resolve built-in role definition ID for role '$roleName'. Verify the role name is correct and this account can read role definitions."
            }
            return $id.Trim()
          }

          function Get-PrincipalId($name) {
            $json = az identity show -g $env:AZURE_RESOURCE_GROUP -n $name -o json --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $json) { return $null }
            return ($json | ConvertFrom-Json).principalId
          }

          function Get-ExistingAssignmentName($principalId, $roleDefinitionId, $scope) {
            if (-not $principalId) { return '' }
            $json = az role assignment list --assignee $principalId --role $roleDefinitionId --scope $scope -o json --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $json) { return '' }
            $assignments = $json | ConvertFrom-Json
            if ($assignments -and $assignments.Count -gt 0) { return $assignments[0].name }
            return ''
          }

          $storageBlobDataReaderRoleId = Get-RoleDefinitionId 'Storage Blob Data Reader'
          $eventHubsDataReceiverRoleId = Get-RoleDefinitionId 'Azure Event Hubs Data Receiver'
          $eventHubsDataSenderRoleId   = Get-RoleDefinitionId 'Azure Event Hubs Data Sender'
          Write-Host "Resolved role definition IDs: StorageBlobDataReader=$storageBlobDataReaderRoleId EventHubsDataReceiver=$eventHubsDataReceiverRoleId EventHubsDataSender=$eventHubsDataSenderRoleId"
          "STORAGE_BLOB_DATA_READER_ROLE_ID=$storageBlobDataReaderRoleId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVENTHUBS_DATA_RECEIVER_ROLE_ID=$eventHubsDataReceiverRoleId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVENTHUBS_DATA_SENDER_ROLE_ID=$eventHubsDataSenderRoleId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $storageScope  = "/subscriptions/$($env:AZURE_SUBSCRIPTION_ID)/resourceGroups/$($env:AZURE_RESOURCE_GROUP)/providers/Microsoft.Storage/storageAccounts/$storageAccountName"
          $eventHubScope = "/subscriptions/$($env:AZURE_SUBSCRIPTION_ID)/resourceGroups/$($env:AZURE_RESOURCE_GROUP)/providers/Microsoft.EventHub/namespaces/$eventHubNamespaceName"

          $adxPrincipalId = Get-PrincipalId $adxManagedIdentityName
          $egPrincipalId  = Get-PrincipalId $eventGridManagedIdentityName

          $ids = [ordered]@{
            adxStorageBlobDataReader    = Get-ExistingAssignmentName $adxPrincipalId $storageBlobDataReaderRoleId $storageScope
            adxEventHubDataReceiver     = Get-ExistingAssignmentName $adxPrincipalId $eventHubsDataReceiverRoleId $eventHubScope
            eventGridEventHubDataSender = Get-ExistingAssignmentName $egPrincipalId  $eventHubsDataSenderRoleId   $eventHubScope
          }

          $json = $ids | ConvertTo-Json -Compress
          Write-Host "Resolved existingRoleAssignmentIds: $json"
          # Escape embedded double quotes: PowerShell doesn't auto-escape
          # quotes embedded in a string when the argument crosses into a
          # native/cmd-shim executable like az.cmd, so passing $json as-is
          # to later "az ... --parameters existingRoleAssignmentIds=..."
          # calls would otherwise arrive corrupted (stripped quotes).
          $escapedJson = $json.Replace('"', '\"')
          "EXISTING_ROLE_ASSIGNMENT_IDS=$escapedJson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: What-if preview
        shell: powershell
        run: |
          az deployment group what-if `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --template-file infra/main.bicep `
            --parameters $env:BICEP_PARAMETER_FILE `
            --parameters existingRoleAssignmentIds="$env:EXISTING_ROLE_ASSIGNMENT_IDS" `
            --parameters storageBlobDataReaderRoleId=$env:STORAGE_BLOB_DATA_READER_ROLE_ID `
            --parameters eventHubsDataReceiverRoleId=$env:EVENTHUBS_DATA_RECEIVER_ROLE_ID `
            --parameters eventHubsDataSenderRoleId=$env:EVENTHUBS_DATA_SENDER_ROLE_ID

      - name: Deploy to SharedDev
        shell: powershell
        run: |
          $stamp = Get-Date -Format 'yyyyMMddHHmmss'
          az deployment group create `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --template-file infra/main.bicep `
            --parameters $env:BICEP_PARAMETER_FILE `
            --parameters existingRoleAssignmentIds="$env:EXISTING_ROLE_ASSIGNMENT_IDS" `
            --parameters storageBlobDataReaderRoleId=$env:STORAGE_BLOB_DATA_READER_ROLE_ID `
            --parameters eventHubsDataReceiverRoleId=$env:EVENTHUBS_DATA_RECEIVER_ROLE_ID `
            --parameters eventHubsDataSenderRoleId=$env:EVENTHUBS_DATA_SENDER_ROLE_ID `
            --name "ci-$stamp"

  post-deploy-regression:
    name: Post-deploy regression (SharedDev)
    runs-on: self-hosted
    needs: deploy-shareddev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: shareddev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure CLI session and select subscription
        shell: powershell
        run: |
          az account show | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No active 'az login' session found on this runner. Run 'az login' on this workstation once and keep the session active."
          }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser

      - name: Run post-deploy regression tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Container = New-PesterContainer -Path 'tests/e2e/Regression.Tests.ps1' -Data @{
            ResourceGroup  = '${{ env.AZURE_RESOURCE_GROUP }}'
            ParameterFile  = '${{ env.BICEP_PARAMETER_FILE }}'
          }
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'post-deploy-e2e-results.xml'
          Invoke-Pester -Configuration $config

      - name: Publish post-deploy test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-post-deploy
          path: post-deploy-e2e-results.xml
